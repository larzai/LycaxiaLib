<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Popup System</title>
  </head>
  <body>
    <img src="https://cdn.pixabay.com/photo/2026/09/04/17/57/17-57-43-356_1280.jpg" alt="Foto Pemandangan" width="400" onclick="lyp.viewImg(this)" />
    
    <button onclick="testInfo()">lyp.info({})</button>
    <button onclick="testConfirmDef()">lyp.confirm({ default })</button>
    
    <script src="./script.js"></script>
    <script>
      lyp.sound("allow");

      function testInfo() {
        lyp.info({
          Mess: "a"
        });
      }

      function testConfirmDef() {
        lyp.confirm({
          Subtitle: "Subtitle",
          Title: "Title",
          Mess: "Apakah anda yakin ingin melanjutkan tindakan ini?",
          Type: "default",
          Event: function() { testInfo(); }
        });
      }
      
      function testConfirmDelete() {
        lyp.confirm({
          Subtitle: "Subtitle",
          Title: "Title",
          Mess: "Apakah anda yakin ingin melanjutkan tindakan ini?",
          Type: "delete",
          Event: function() { testInfo(); }
        });
      }
    </script>
  </body>
</html>
